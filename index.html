<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniOS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='none' stroke='red' stroke-width='2'/></svg>">
<style>
@font-face{font-family:'Bioweapon';src:url('font.ttf') format('truetype')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#000;cursor:default;user-select:none}
#desktop{width:100%;height:100%;position:relative}
#desktop>img{width:100%;height:100%;object-fit:cover;image-rendering:high-quality}
#omni-icon{position:absolute;bottom:30px;left:30px;width:150px;height:150px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.3s}
#omni-icon:hover{transform:scale(1.1)}
.glow{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,15,15,0.5) 0%,transparent 60%);filter:blur(20px);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.7}50%{transform:scale(1.2);opacity:1}}
.arc-wrap{position:absolute;width:140px;height:140px;animation:spin 2.5s linear infinite;filter:drop-shadow(0 0 8px rgba(255,20,20,0.9))}
@keyframes spin{to{transform:rotate(360deg)}}
.center-text{position:relative;z-index:5;color:#fff;font-family:'Bioweapon',sans-serif;font-size:14px;letter-spacing:3px;text-shadow:0 0 10px rgba(255,30,30,0.9),0 0 20px rgba(255,30,30,0.6),0 0 40px rgba(255,30,30,0.3);animation:textGlow 2s ease-in-out infinite}
@keyframes textGlow{0%,100%{text-shadow:0 0 10px rgba(255,30,30,0.9),0 0 20px rgba(255,30,30,0.6)}50%{text-shadow:0 0 15px rgba(255,30,30,1),0 0 30px rgba(255,30,30,0.8)}}
#lockscreen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000;transition:opacity 0.6s ease,visibility 0.6s}
#lockscreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
#lockscreen .lock-title{color:#fff;font-family:'Bioweapon',sans-serif;font-size:clamp(18px,3vw,32px);letter-spacing:10px;margin-bottom:clamp(30px,5vh,60px);text-shadow:0 0 15px rgba(255,30,30,0.6)}
.arrow-grid{display:flex;flex-direction:row;gap:clamp(12px,2vw,30px);align-items:flex-end}
.arrow-col{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,0.6vh,8px);opacity:0.3;transition:opacity 0.3s,transform 0.3s}
.arrow-col.active{opacity:1;transform:scale(1.05)}
.arrow-col.done{opacity:0.5}
.arrow-col .col-num{color:#555;font-family:'Bioweapon',sans-serif;font-size:clamp(12px,1.8vw,18px);margin-top:clamp(6px,1vh,12px);letter-spacing:2px}
.arrow-col.active .col-num{color:#ff3333}
.arrow{width:clamp(28px,4vw,48px);height:clamp(28px,4vw,48px);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3vw,36px);color:#222;transition:all 0.15s}
.arrow.filled{color:#ff2222;text-shadow:0 0 8px rgba(255,30,30,0.9),0 0 16px rgba(255,30,30,0.5),0 0 24px rgba(255,30,30,0.3);transform:scale(1.1)}
.arrow-col.active .arrow{color:#444}
.arrow-col.active .arrow.filled{color:#ff2222;text-shadow:0 0 8px rgba(255,30,30,0.9),0 0 16px rgba(255,30,30,0.5),0 0 24px rgba(255,30,30,0.3);transform:scale(1.1)}
#lock-hint{margin-top:clamp(25px,4vh,50px);color:#555;font-family:'Bioweapon',sans-serif;font-size:clamp(10px,1.4vw,14px);letter-spacing:4px}
#lock-msg{margin-top:clamp(12px,2vh,24px);font-family:'Bioweapon',sans-serif;font-size:clamp(14px,2vw,20px);letter-spacing:3px;height:clamp(18px,2.5vh,26px)}
#lock-msg.error{color:#ff3333;text-shadow:0 0 10px rgba(255,30,30,0.5)}
#lock-msg.success{color:#33ff33;text-shadow:0 0 10px rgba(50,255,50,0.5)}
</style></head><body>
<div id="lockscreen">
<div class="lock-title">ACCESO RESTRINGIDO</div>
<div class="arrow-grid" id="arrowGrid"></div>
<div id="lock-hint"></div>
<div id="lock-msg"></div></div>
<div id="desktop">
<img src="Fondo.jpeg">
<div id="omni-icon"><div class="glow"></div>
<svg class="arc-wrap" viewBox="0 0 140 140">
<circle cx="70" cy="70" r="60" fill="none" stroke="#ff3333" stroke-width="5" stroke-dasharray="94 283" stroke-linecap="round"/>
<circle cx="70" cy="70" r="60" fill="none" stroke="#ee1111" stroke-width="5" stroke-dasharray="94 283" stroke-linecap="round" transform="rotate(120 70 70)"/>
<circle cx="70" cy="70" r="60" fill="none" stroke="#cc0000" stroke-width="5" stroke-dasharray="94 283" stroke-linecap="round" transform="rotate(240 70 70)"/>
</svg><div class="center-text">O.M.N.I</div></div></div>
<script>
try{navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){console.log('[MIC] Track:',s.getAudioTracks()[0].label);s.getTracks().forEach(function(t){t.stop()})}).catch(function(e){console.log('[MIC] getUserMedia err:',e)})}catch(e){console.log('[MIC] navigator error:',e)}
var out=document.getElementById('lock-msg');
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){out.textContent='NO DISPONIBLE'}
if(SR){
var rec=new SR();
rec.continuous=true;
rec.interimResults=true;
rec.lang='es-ES';
rec.onstart=function(){console.log('[MIC] LISTENING')};
rec.onresult=function(e){
  var txt='';
  for(var i=0;i<e.results.length;i++){
    txt+=e.results[i][0].transcript+' (final:'+e.results[i].isFinal+')\n';
  }
  out.textContent=txt;
  var last=e.results[e.results.length-1];
  if(last.isFinal){
    var t=last[0].transcript.toLowerCase().replace(/[^a-z0-9\u00e1\u00e9\u00ed\u00f3\u00fa\s]/g,'');
    var w2n={'uno':'1','dos':'2','tres':'3','cuatro':'4','cinco':'5','seis':'6','siete':'7','ocho':'8','nueve':'9','cero':'0','un':'1'};
    var nums='';
    var parts=t.split(/\s+/);
    for(var j=0;j<parts.length;j++){
      if(w2n[parts[j]]!==undefined)nums+=w2n[parts[j]];
      else if(/^\d$/.test(parts[j]))nums+=parts[j];
    }
    console.log('[MIC]',t,'->',nums);
  }
};
rec.onerror=function(e){console.log('[MIC] Error:',e.error);out.textContent='ERROR: '+e.error};
rec.onend=function(){try{rec.start()}catch(x){}};
rec.start();
console.log('[MIC] Started');
}

var ROWS=6,COLS=10,PASSWORD=[1,4,4,1,2,4],currentRow=0,counts=[];
for(var i=0;i<ROWS;i++)counts.push(0);
var grid=document.getElementById('arrowGrid'),msg=document.getElementById('lock-msg');

function renderGrid(){grid.innerHTML='';for(var r=0;r<ROWS;r++){var col=document.createElement('div');col.className='arrow-col'+(r===currentRow?' active':'')+(r<currentRow?' done':'');for(var c=COLS-1;c>=0;c--){var a=document.createElement('span');a.className='arrow'+(c<counts[r]?' filled':'');a.textContent='\u2191';col.appendChild(a)}var num=document.createElement('span');num.className='col-num';num.textContent=r+1;col.appendChild(num);grid.appendChild(col)}}

function resetAll(){for(var i=0;i<ROWS;i++)counts[i]=0;currentRow=0;msg.textContent='';msg.className='';renderGrid()}

function checkPassword(){for(var i=0;i<ROWS;i++)if(counts[i]!==PASSWORD[i])return false;return true}

function tryPassword(nums){
  for(var k=0;k<ROWS;k++)counts[k]=parseInt(nums[k])||0;
  renderGrid();
  if(checkPassword()){
    msg.textContent='ACCESO CONCEDIDO';msg.className='success';
    setTimeout(function(){document.getElementById('lockscreen').classList.add('hidden')},800);
  }else{
    msg.textContent='CLAVE INCORRECTA';msg.className='error';
    setTimeout(resetAll,1200);
  }
}

document.addEventListener('keydown',function(e){
  if(currentRow>=ROWS)return;
  if(e.key==='ArrowUp'){e.preventDefault();if(counts[currentRow]<COLS){counts[currentRow]++;msg.textContent='';msg.className='';renderGrid()}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(counts[currentRow]>0){counts[currentRow]--;msg.textContent='';msg.className='';renderGrid()}}
  else if(e.key==='Escape'){e.preventDefault();if(currentRow>0){currentRow--;renderGrid()}}
  else if(e.key==='Enter'){e.preventDefault();if(currentRow===ROWS-1){if(checkPassword()){msg.textContent='ACCESO CONCEDIDO';msg.className='success';setTimeout(function(){document.getElementById('lockscreen').classList.add('hidden')},800)}else{msg.textContent='CLAVE INCORRECTA';msg.className='error';setTimeout(resetAll,1200)}}else{currentRow++;renderGrid()}}
  else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();if(counts[currentRow]>0){counts[currentRow]--;renderGrid()}}
});

renderGrid();

var hint=document.getElementById('lock-hint');
hint.innerHTML='<div id="pwdDisplay" style="color:#ff3333;font-family:Bioweapon,sans-serif;font-size:clamp(18px,3vw,32px);letter-spacing:12px;min-height:clamp(24px,3vw,36px);text-shadow:0 0 10px rgba(255,30,30,0.5)"></div><div style="margin-top:8px;color:#444;font-size:clamp(8px,1.2vw,11px);letter-spacing:2px">ESCRIBE LA CLAVE Y PRESIONA ENTER</div>';
var pwdBuffer='';
document.addEventListener('keydown',function(e){
  if(document.getElementById('lockscreen').classList.contains('hidden'))return;
  if(e.key>='0'&&e.key<='9'&&pwdBuffer.length<6){
    pwdBuffer+=e.key;
    document.getElementById('pwdDisplay').textContent=pwdBuffer.replace(/./g,'\u2022');
  }else if(e.key==='Backspace'){
    pwdBuffer=pwdBuffer.slice(0,-1);
    document.getElementById('pwdDisplay').textContent=pwdBuffer.replace(/./g,'\u2022');
  }else if(e.key==='Enter'&&pwdBuffer.length===6){
    tryPassword(pwdBuffer);
    pwdBuffer='';
    document.getElementById('pwdDisplay').textContent='';
  }
});

document.getElementById('desktop').addEventListener('dblclick',function(){document.documentElement.requestFullscreen()});
document.getElementById('desktop').addEventListener('contextmenu',function(e){e.preventDefault()});
</script></body></html>
