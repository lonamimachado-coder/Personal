<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --yellow: #FFD900;
    --yellow-dark: #E6C300;
    --yellow-light: #FFF7CC;
    --yellow-bg: #FFFDE7;
    --green: #58CC02;
    --red: #FF4B4B;
    --text: #1A1A1A;
    --text-muted: #777;
    --border: #E5E5E5;
    --white: #FFFFFF;
    --bubble-me: #FFD900;
    --bubble-them: #F0F0F0;
    --shadow: 0 4px 0px rgba(0,0,0,0.12);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--yellow-bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
  }

  #app {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    background: var(--white);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }

  @media (max-width: 420px) {
    #app { max-width: 100%; box-shadow: none; }
  }

  /* ===== SCREENS ===== */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--white);
    transition: transform 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s;
    opacity: 1;
  }

  .screen.hidden {
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
  }

  .screen.slide-left.hidden {
    transform: translateX(-30%);
  }

  /* ===== AUTH SCREEN ===== */
  #auth-screen {
    background: var(--white);
    padding: 40px 28px 32px;
    justify-content: center;
    gap: 0;
  }

  .auth-logo {
    text-align: center;
    margin-bottom: 36px;
  }

  .auth-logo .logo-icon {
    width: 80px;
    height: 80px;
    background: var(--yellow);
    border-radius: 22px;
    box-shadow: var(--shadow);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 14px;
    border: 3px solid var(--yellow-dark);
  }

  .auth-logo h1 {
    font-size: 32px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -1px;
  }

  .auth-logo p {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 600;
    margin-top: 4px;
  }

  .auth-tabs {
    display: flex;
    background: var(--yellow-light);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 24px;
  }

  .auth-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 11px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .auth-tab.active {
    background: var(--yellow);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  .input-group {
    margin-bottom: 14px;
  }

  .input-group label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 16px;
    border: 2.5px solid var(--border);
    border-radius: var(--radius);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    background: var(--white);
    outline: none;
    transition: border-color 0.2s;
  }

  .input-group input:focus {
    border-color: var(--yellow);
  }

  .btn-primary {
    width: 100%;
    padding: 15px;
    background: var(--yellow);
    border: none;
    border-radius: var(--radius);
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 900;
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }

  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 0px rgba(0,0,0,0.14); }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0px rgba(0,0,0,0.12); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .auth-error {
    background: #FFECEC;
    border: 2px solid var(--red);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--red);
    margin-top: 12px;
    display: none;
  }

  /* ===== HOME SCREEN ===== */
  #home-screen {
    background: var(--white);
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    background: var(--yellow);
    border-bottom: 3px solid var(--yellow-dark);
  }

  .top-bar h2 {
    font-size: 22px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .top-bar .user-tag {
    font-size: 13px;
    font-weight: 700;
    color: rgba(0,0,0,0.55);
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: rgba(0,0,0,0.1);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: background 0.15s;
  }

  .icon-btn:hover { background: rgba(0,0,0,0.18); }

  .search-bar-wrap {
    padding: 12px 16px;
    background: var(--yellow-bg);
    border-bottom: 2px solid var(--border);
  }

  .search-bar {
    display: flex;
    align-items: center;
    background: var(--white);
    border: 2.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    gap: 10px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .search-bar:hover { border-color: var(--yellow); }
  .search-bar span { font-size: 14px; font-weight: 700; color: var(--text-muted); }

  .conversations-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .conv-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1.5px solid var(--border);
  }

  .conv-item:hover { background: var(--yellow-bg); }

  .avatar {
    width: 50px;
    height: 50px;
    border-radius: 16px;
    background: var(--yellow);
    border: 2.5px solid var(--yellow-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    color: var(--text);
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .conv-info { flex: 1; min-width: 0; }

  .conv-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .conv-last {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .conv-time {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .conv-unread {
    background: var(--yellow);
    border: 2px solid var(--yellow-dark);
    border-radius: 10px;
    min-width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: var(--text);
    padding: 0 5px;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    gap: 12px;
  }

  .empty-state .emoji { font-size: 56px; }
  .empty-state h3 { font-size: 20px; font-weight: 900; color: var(--text); }
  .empty-state p { font-size: 14px; font-weight: 600; color: var(--text-muted); line-height: 1.5; }

  .fab {
    position: absolute;
    bottom: 24px;
    right: 20px;
    width: 58px;
    height: 58px;
    border-radius: 18px;
    background: var(--yellow);
    border: 3px solid var(--yellow-dark);
    box-shadow: var(--shadow);
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
    z-index: 10;
  }

  .fab:hover { transform: scale(1.07); }
  .fab:active { transform: scale(0.95); }

  /* ===== SEARCH SCREEN ===== */
  #search-screen {
    background: var(--white);
  }

  .search-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 16px 12px;
    background: var(--yellow);
    border-bottom: 3px solid var(--yellow-dark);
  }

  .search-header input {
    flex: 1;
    padding: 12px 16px;
    border: 2.5px solid rgba(0,0,0,0.15);
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    background: rgba(255,255,255,0.85);
    outline: none;
    color: var(--text);
    transition: background 0.2s, border-color 0.2s;
  }

  .search-header input:focus {
    background: var(--white);
    border-color: var(--yellow-dark);
  }

  .back-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: rgba(0,0,0,0.1);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .search-results {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }

  .search-hint {
    text-align: center;
    padding: 40px 24px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .search-hint .emoji { font-size: 40px; display: block; margin-bottom: 10px; }

  .user-result {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .user-result:hover { background: var(--yellow-bg); }

  .user-result-info { flex: 1; }
  .user-result-name { font-size: 16px; font-weight: 800; color: var(--text); }
  .user-result-tag { font-size: 13px; font-weight: 600; color: var(--text-muted); }

  .btn-chat {
    padding: 8px 16px;
    background: var(--yellow);
    border: 2px solid var(--yellow-dark);
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 900;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    transition: transform 0.1s;
  }

  .btn-chat:hover { transform: translateY(-1px); }
  .btn-chat:active { transform: translateY(1px); }

  /* ===== CHAT SCREEN ===== */
  #chat-screen {
    background: var(--white);
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--yellow);
    border-bottom: 3px solid var(--yellow-dark);
    flex-shrink: 0;
  }

  .chat-header .avatar { width: 42px; height: 42px; border-radius: 13px; font-size: 16px; }

  .chat-header-info { flex: 1; }
  .chat-header-name { font-size: 16px; font-weight: 900; color: var(--text); }
  .chat-header-status { font-size: 12px; font-weight: 700; color: rgba(0,0,0,0.5); }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--yellow-bg);
    background-image: radial-gradient(circle at 20% 20%, rgba(255,217,0,0.08) 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, rgba(255,217,0,0.06) 0%, transparent 50%);
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 78%;
  }

  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.them { align-self: flex-start; align-items: flex-start; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
    max-width: 100%;
    position: relative;
  }

  .msg-row.me .msg-bubble {
    background: var(--yellow);
    color: var(--text);
    border-bottom-right-radius: 5px;
    border: 2px solid var(--yellow-dark);
  }

  .msg-row.them .msg-bubble {
    background: var(--white);
    color: var(--text);
    border-bottom-left-radius: 5px;
    border: 2px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .msg-time {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    margin-top: 3px;
    padding: 0 4px;
  }

  .msg-date-divider {
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
    background: rgba(255,217,0,0.2);
    border: 1.5px solid rgba(255,217,0,0.4);
    border-radius: 20px;
    padding: 4px 14px;
    align-self: center;
    margin: 8px 0;
  }

  .chat-input-area {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 14px;
    background: var(--white);
    border-top: 2.5px solid var(--border);
    flex-shrink: 0;
  }

  .chat-input-area textarea {
    flex: 1;
    border: 2.5px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    resize: none;
    outline: none;
    min-height: 46px;
    max-height: 120px;
    line-height: 1.4;
    transition: border-color 0.2s;
  }

  .chat-input-area textarea:focus { border-color: var(--yellow); }

  .send-btn {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: var(--yellow);
    border: 2.5px solid var(--yellow-dark);
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .send-btn:hover { transform: translateY(-1px); }
  .send-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== LOADING ===== */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 16px;
    font-size: 15px;
    font-weight: 800;
    color: var(--text-muted);
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid var(--yellow-light);
    border-top: 4px solid var(--yellow);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--yellow-light); border-radius: 10px; }

  /* ===== ANIMATIONS ===== */
  @keyframes popIn {
    from { transform: scale(0.92); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .msg-bubble { animation: popIn 0.18s ease-out; }

  .conversations-list { scroll-behavior: smooth; }
</style>
</head>
<body>

<div id="app">

  <!-- AUTH SCREEN -->
  <div class="screen" id="auth-screen">
    <div class="auth-logo">
      <div class="logo-icon">💬</div>
      <h1>Chat</h1>
      <p>Mensajes, sin vueltas.</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Entrar</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Registrarse</button>
    </div>

    <!-- LOGIN -->
    <div id="login-form">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="login-btn" onclick="doLogin()">Entrar →</button>
    </div>

    <!-- REGISTER -->
    <div id="register-form" style="display:none">
      <div class="input-group">
        <label>Usuario</label>
        <input type="text" id="reg-username" placeholder="tunombre" autocomplete="off"
               oninput="this.value=this.value.replace(/[^a-z0-9_]/gi,'').toLowerCase()">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="reg-btn" onclick="doRegister()">Crear cuenta →</button>
    </div>

    <div class="auth-error" id="auth-error"></div>
  </div>

  <!-- HOME SCREEN -->
  <div class="screen hidden slide-left" id="home-screen">
    <div class="top-bar">
      <div>
        <h2>Chat</h2>
        <div class="user-tag" id="home-username">@usuario</div>
      </div>
      <button class="icon-btn" onclick="doLogout()" title="Salir">🚪</button>
    </div>

    <div class="search-bar-wrap">
      <div class="search-bar" onclick="showScreen('search-screen')">
        <span>🔍</span>
        <span>Buscar usuario...</span>
      </div>
    </div>

    <div class="conversations-list" id="conversations-list">
      <div class="empty-state" id="empty-convs">
        <span class="emoji">✉️</span>
        <h3>Sin chats aún</h3>
        <p>Buscá un usuario y empezá a chatear.</p>
      </div>
    </div>

    <button class="fab" onclick="showScreen('search-screen')" title="Nuevo chat">✏️</button>
  </div>

  <!-- SEARCH SCREEN -->
  <div class="screen hidden" id="search-screen">
    <div class="search-header">
      <button class="back-btn" onclick="showScreen('home-screen')">←</button>
      <input type="text" id="search-input" placeholder="Buscar por usuario..."
             autocomplete="off" oninput="searchUsers(this.value)"
             autocapitalize="none">
    </div>

    <div class="search-results" id="search-results">
      <div class="search-hint">
        <span class="emoji">🔍</span>
        Escribí un nombre de usuario para buscar.
      </div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div class="screen hidden" id="chat-screen">
    <div class="chat-header">
      <button class="back-btn" onclick="showScreen('home-screen')">←</button>
      <div class="avatar" id="chat-avatar">?</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chat-partner-name">Usuario</div>
        <div class="chat-header-status">@<span id="chat-partner-username">user</span></div>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages"></div>

    <div class="chat-input-area">
      <textarea id="msg-input" placeholder="Escribí un mensaje..." rows="1"
                onkeydown="handleMsgKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ===== FIREBASE INIT =====
const firebaseConfig = {
  apiKey: "AIzaSyDRlVs6JAkyt5Op-mUGaLXbI95fwewH_n4",
  authDomain: "imapersonal-79a48.firebaseapp.com",
  projectId: "imapersonal-79a48",
  storageBucket: "imapersonal-79a48.firebasestorage.app",
  messagingSenderId: "226302507123",
  appId: "1:226302507123:web:bac73982b2cab122aa5206",
  measurementId: "G-8H4BHJVGBK"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ===== STATE =====
let currentUser   = null;
let currentUserData = null;
let chatPartner   = null;
let chatId        = null;
let unsubMessages = null;
let unsubConvs    = null;
let searchTimer   = null;

// ===== SCREEN MANAGEMENT =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.add('hidden');
    s.classList.remove('slide-left');
  });
  const target = document.getElementById(id);
  target.classList.remove('hidden');

  // Focus helpers
  if (id === 'search-screen') {
    setTimeout(() => document.getElementById('search-input').focus(), 200);
  }
  if (id === 'chat-screen') {
    setTimeout(() => document.getElementById('msg-input').focus(), 200);
  }
}

// ===== AUTH TABS =====
function switchTab(tab) {
  document.getElementById('login-form').style.display    = tab === 'login'    ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  hideError();
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('auth-error').style.display = 'none';
}

// ===== LOGIN =====
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if (!email || !pass) { showError('Completá todos los campos.'); return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    showError(friendlyError(e.code));
    btn.disabled = false; btn.textContent = 'Entrar →';
  }
}

// ===== REGISTER =====
async function doRegister() {
  const username = document.getElementById('reg-username').value.trim().toLowerCase();
  const email    = document.getElementById('reg-email').value.trim();
  const pass     = document.getElementById('reg-pass').value;

  if (!username || !email || !pass) { showError('Completá todos los campos.'); return; }
  if (username.length < 3) { showError('El usuario debe tener al menos 3 caracteres.'); return; }
  if (pass.length < 6) { showError('La contraseña debe tener al menos 6 caracteres.'); return; }

  const btn = document.getElementById('reg-btn');
  btn.disabled = true; btn.textContent = 'Creando cuenta...';

  try {
    // Create auth user first
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid  = cred.user.uid;

    // Check username taken (now authenticated)
    const usernameDoc = await db.collection('usernames').doc(username).get();
    if (usernameDoc.exists) {
      await cred.user.delete();
      showError('Ese usuario ya está tomado, elegí otro.');
      btn.disabled = false; btn.textContent = 'Crear cuenta →';
      return;
    }

    const batch = db.batch();
    batch.set(db.collection('users').doc(uid), {
      uid, username, email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    batch.set(db.collection('usernames').doc(username), { uid });
    await batch.commit();

  } catch(e) {
    showError(friendlyError(e.code));
    btn.disabled = false; btn.textContent = 'Crear cuenta →';
  }
}

// ===== LOGOUT =====
async function doLogout() {
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }
  if (unsubConvs)    { unsubConvs();    unsubConvs    = null; }
  await auth.signOut();
}

// ===== AUTH STATE =====
auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;
    let snap, attempts = 0;
    do {
      snap = await db.collection('users').doc(user.uid).get();
      if (!snap.exists) await new Promise(r => setTimeout(r, 700));
      attempts++;
    } while (!snap.exists && attempts < 8);
    if (!snap.exists) return;
    currentUserData = snap.data();
    document.getElementById('home-username').textContent = '@' + currentUserData.username;
    showScreen('home-screen');
    loadConversations();
  } else {
    currentUser = null;
    currentUserData = null;
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    if (unsubConvs)    { unsubConvs();    unsubConvs    = null; }
    showScreen('auth-screen');
  }
});

// ===== CONVERSATIONS =====
function loadConversations() {
  if (unsubConvs) unsubConvs();
  unsubConvs = db.collection('chats')
    .where('participants', 'array-contains', currentUser.uid)
    .orderBy('lastTime', 'desc')
    .onSnapshot(async snap => {
      const list = document.getElementById('conversations-list');
      const empty = document.getElementById('empty-convs');

      if (snap.empty) {
        list.innerHTML = '';
        list.appendChild(empty);
        empty.style.display = 'flex';
        return;
      }

      empty.style.display = 'none';

      // Collect partner UIDs
      const convs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      // Fetch partner data in parallel
      const partnerUids = convs.map(c => c.participants.find(p => p !== currentUser.uid));
      const partnerDocs = await Promise.all(
        partnerUids.map(uid => db.collection('users').doc(uid).get())
      );

      list.innerHTML = '';

      convs.forEach((conv, i) => {
        const partner = partnerDocs[i].data();
        if (!partner) return;

        const item = document.createElement('div');
        item.className = 'conv-item';
        item.onclick = () => openChat(partner);

        const lastMsg = conv.lastMessage || '';
        const lastTime = conv.lastTime ? formatTime(conv.lastTime.toDate()) : '';

        item.innerHTML = `
          <div class="avatar">${partner.username[0].toUpperCase()}</div>
          <div class="conv-info">
            <div class="conv-name">@${partner.username}</div>
            <div class="conv-last">${escapeHtml(lastMsg)}</div>
          </div>
          <div class="conv-time">${lastTime}</div>
        `;
        list.appendChild(item);
      });
    });
}

// ===== SEARCH USERS =====
let lastSearchVal = '';
async function searchUsers(val) {
  val = val.trim().toLowerCase();
  if (val === lastSearchVal) return;
  lastSearchVal = val;

  const results = document.getElementById('search-results');

  if (!val || val.length < 2) {
    results.innerHTML = '<div class="search-hint"><span class="emoji">🔍</span>Escribí al menos 2 caracteres.</div>';
    return;
  }

  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    results.innerHTML = '<div class="search-hint"><span class="emoji">⏳</span>Buscando...</div>';

    try {
      const snap = await db.collection('users')
        .where('username', '>=', val)
        .where('username', '<=', val + '\uf8ff')
        .limit(12)
        .get();

      if (snap.empty) {
        results.innerHTML = '<div class="search-hint"><span class="emoji">😕</span>No se encontró ningún usuario.</div>';
        return;
      }

      results.innerHTML = '';
      let found = 0;
      snap.docs.forEach(doc => {
        try {
          const u = doc.data();
          // Skip if missing required fields or is current user
          if (!u.username || !u.uid) return;
          if (u.uid === currentUser.uid) return;

          found++;
          const item = document.createElement('div');
          item.className = 'user-result';
          const safeU = JSON.stringify({ uid: u.uid, username: u.username, email: u.email || '' }).replace(/"/g,'&quot;');
          item.innerHTML = `
            <div class="avatar">${u.username[0].toUpperCase()}</div>
            <div class="user-result-info">
              <div class="user-result-name">@${u.username}</div>
            </div>
            <button class="btn-chat" onclick="openChat(${safeU})">Chat</button>
          `;
          results.appendChild(item);
        } catch(err) { /* skip malformed doc */ }
      });
      if (found === 0) {
        results.innerHTML = '<div class="search-hint"><span class="emoji">😕</span>No se encontró ningún usuario.</div>';
      }

    } catch(e) {
      results.innerHTML = '<div class="search-hint"><span class="emoji">❌</span>Error al buscar.</div>';
    }
  }, 350);
}

// ===== OPEN CHAT =====
function openChat(partner) {
  chatPartner = partner;
  chatId = [currentUser.uid, partner.uid].sort().join('_');

  document.getElementById('chat-avatar').textContent = partner.username[0].toUpperCase();
  document.getElementById('chat-partner-name').textContent = partner.username;
  document.getElementById('chat-partner-username').textContent = partner.username;
  document.getElementById('chat-messages').innerHTML = '';
  document.getElementById('msg-input').value = '';

  showScreen('chat-screen');
  listenMessages();
}

// ===== MESSAGES LISTENER =====
function listenMessages() {
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }

  unsubMessages = db.collection('chats').doc(chatId)
    .collection('messages')
    .orderBy('timestamp', 'asc')
    .onSnapshot(snap => {
      const container = document.getElementById('chat-messages');
      const wasAtBottom = isAtBottom(container);

      let lastDate = null;
      container.innerHTML = '';

      snap.docs.forEach(doc => {
        const msg = doc.data();
        const ts  = msg.timestamp ? msg.timestamp.toDate() : new Date();
        const dateStr = formatDate(ts);

        if (dateStr !== lastDate) {
          const div = document.createElement('div');
          div.className = 'msg-date-divider';
          div.textContent = dateStr;
          container.appendChild(div);
          lastDate = dateStr;
        }

        const isMe = msg.sender === currentUser.uid;
        const row  = document.createElement('div');
        row.className = `msg-row ${isMe ? 'me' : 'them'}`;
        row.innerHTML = `
          <div class="msg-bubble">${escapeHtml(msg.text)}</div>
          <div class="msg-time">${formatHour(ts)}</div>
        `;
        container.appendChild(row);
      });

      if (wasAtBottom || snap.docChanges().some(c => c.type === 'added')) {
        scrollToBottom(container);
      }
    });
}

// ===== SEND MESSAGE =====
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text || !chatId) return;

  input.value = '';
  autoResize(input);

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  setTimeout(() => btn.disabled = false, 500);

  const ts = firebase.firestore.FieldValue.serverTimestamp();

  await Promise.all([
    db.collection('chats').doc(chatId)
      .collection('messages')
      .add({ text, sender: currentUser.uid, timestamp: ts }),

    db.collection('chats').doc(chatId).set({
      participants: [currentUser.uid, chatPartner.uid],
      lastMessage: text,
      lastTime: ts,
      lastSender: currentUser.uid
    }, { merge: true })
  ]);
}

function handleMsgKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ===== HELPERS =====
function getChatId(uid1, uid2) {
  return [uid1, uid2].sort().join('_');
}

function isAtBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight < 60;
}

function scrollToBottom(el) {
  el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

function formatTime(date) {
  const now = new Date();
  const diff = (now - date) / 1000;
  if (diff < 60)   return 'ahora';
  if (diff < 3600) return Math.floor(diff/60) + 'm';
  if (diff < 86400) return formatHour(date);
  return date.toLocaleDateString('es', { day:'numeric', month:'short' });
}

function formatHour(date) {
  return date.toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
}

function formatDate(date) {
  const now   = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const d     = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diff  = (today - d) / 86400000;
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  return date.toLocaleDateString('es', { weekday:'long', day:'numeric', month:'long' });
}

function friendlyError(code) {
  const map = {
    'auth/user-not-found':       'No existe una cuenta con ese email.',
    'auth/wrong-password':       'Contraseña incorrecta.',
    'auth/email-already-in-use': 'Ese email ya tiene una cuenta.',
    'auth/invalid-email':        'El email no es válido.',
    'auth/weak-password':        'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests':    'Demasiados intentos. Esperá un momento.',
    'auth/invalid-credential':   'Email o contraseña incorrectos.',
  };
  return map[code] || 'Algo salió mal. Intentá de nuevo.';
}

// Enter to submit on auth inputs
document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('reg-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doRegister();
});
