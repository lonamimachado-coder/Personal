<style>
/* ===============================================================
   1. VARIABLES DE DISEÑO (paleta: blanco, negro, celeste)
   =============================================================== */
:root{
  /* Color principal de marca (extraído del logo) */
  --celeste:        #00D3FC;
  --celeste-hover:  #00BEE6;
  --celeste-press:  #00A9CE;
  --celeste-10:     rgba(0,211,252,0.10);
  --celeste-15:     rgba(0,211,252,0.15);
  --celeste-30:     rgba(0,211,252,0.30);

  /* Blanco y negro (con alfa para jerarquía visual) */
  --white:          #FFFFFF;
  --ink:            #0B0B0C;          /* texto principal (negro) */
  --ink-2:          rgba(11,11,12,0.62); /* texto secundario */
  --ink-3:          rgba(11,11,12,0.40); /* texto terciario */
  --hairline:       rgba(11,11,12,0.08); /* bordes sutiles */
  --hairline-2:     rgba(11,11,12,0.14);

  /* Sombras suaves */
  --shadow-sm:  0 2px 8px  rgba(11,11,12,0.06);
  --shadow-md:  0 8px 24px rgba(11,11,12,0.08);
  --shadow-lg:  0 18px 50px rgba(11,11,12,0.12);

  /* Radios */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* Layout */
  --topbar-h: 64px;
  --sidebar-w: 268px;
  --bottomnav-h: 66px;

  /* Tipografía */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* ===============================================================
   2. RESET Y BASE
   =============================================================== */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--white);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
img{ display:block; max-width:100%; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea,select{ font-family:inherit; font-size:16px; color:var(--ink); }
a{ color:var(--celeste-press); text-decoration:none; }
::selection{ background:var(--celeste-30); }

/* Scrollbar minimalista */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--hairline-2); border-radius:999px; border:3px solid var(--white); }
::-webkit-scrollbar-thumb:hover{ background:var(--celeste-30); }

/* ===============================================================
   3. UTILIDADES
   =============================================================== */
.hidden{ display:none !important; }
.flex{ display:flex; }
.center{ display:flex; align-items:center; justify-content:center; }
.col{ display:flex; flex-direction:column; }
.gap-s{ gap:8px; } .gap-m{ gap:14px; } .gap-l{ gap:22px; }
.muted{ color:var(--ink-2); }
.tiny{ font-size:12px; }
.spin{ animation:spin 0.9s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* Spinner */
.spinner{
  width:22px; height:22px; border-radius:50%;
  border:2.5px solid var(--hairline-2);
  border-top-color:var(--celeste);
  animation:spin 0.8s linear infinite;
}

/* ===============================================================
   4. BOTONES (con efecto ripple)
   =============================================================== */
.btn{
  position:relative; overflow:hidden;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 20px; border-radius:var(--r-pill);
  font-size:15px; font-weight:600; letter-spacing:.2px;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
  user-select:none; white-space:nowrap;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--celeste); color:#04303a; box-shadow:var(--shadow-sm); }
.btn-primary:hover{ background:var(--celeste-hover); box-shadow:var(--shadow-md); }
.btn-ghost{ background:var(--white); color:var(--ink); border:1.5px solid var(--hairline-2); }
.btn-ghost:hover{ border-color:var(--celeste); color:var(--celeste-press); background:var(--celeste-10); }
.btn-dark{ background:var(--ink); color:#fff; }
.btn-dark:hover{ background:#000; }
.btn-block{ width:100%; }
.btn-lg{ padding:15px 26px; font-size:16px; }
.btn-sm{ padding:9px 15px; font-size:13.5px; }

/* Ripple */
.ripple-dot{
  position:absolute; border-radius:50%; transform:scale(0);
  background:rgba(255,255,255,.45); pointer-events:none;
  animation:rippleAnim .6s ease-out;
}
.btn-ghost .ripple-dot{ background:var(--celeste-30); }
@keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }

/* Iconos SVG (sistema de iconos lineales) */
.ico{ display:inline-flex; align-items:center; justify-content:center; color:inherit; }
.ico svg, .bn-item .ico svg, .tc-ico svg, .dz-ico svg, .em-ico svg, .menu-item .ico svg, .rm svg{
  display:block; width:100%; height:100%;
}
.nav-item .ico{ width:22px; height:22px; }
.bn-item .ico{ width:22px; height:22px; }
.menu-item .ico{ width:20px; height:20px; }
.tc-ico{ width:34px; height:34px; color:var(--celeste-press); margin:0 auto 8px; }
.dz-ico{ width:30px; height:30px; color:var(--celeste-press); margin:0 auto 6px; }
.em-ico{ width:54px; height:54px; color:var(--ink-3); margin:0 auto 14px; opacity:.85; }
.rm{ display:flex; align-items:center; justify-content:center; }
.rm svg{ width:13px; height:13px; }
.lb-close svg{ display:block; }

/* ===============================================================
   5. CAMPOS DE FORMULARIO
   =============================================================== */
.field{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
.field label{ font-size:13.5px; font-weight:600; color:var(--ink-2); }
.field .req{ color:var(--celeste-press); }
.input, .textarea, .select{
  width:100%; padding:13px 15px; border-radius:var(--r-sm);
  border:1.5px solid var(--hairline-2); background:var(--white);
  transition:border-color .18s ease, box-shadow .18s ease;
  outline:none;
}
.input:focus, .textarea:focus, .select:focus{
  border-color:var(--celeste); box-shadow:0 0 0 4px var(--celeste-15);
}
.textarea{ resize:vertical; min-height:110px; line-height:1.55; }
.hint{ font-size:12px; color:var(--ink-3); }

/* ===============================================================
   6. PANTALLA DE LOGIN / REGISTRO
   =============================================================== */
#login-view{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(1200px 600px at 50% -10%, var(--celeste-10), transparent 60%),
    var(--white);
  padding:24px;
}
.auth-card{
  width:100%; max-width:420px; background:var(--white);
  border-radius:var(--r-xl); box-shadow:var(--shadow-lg);
  border:1px solid var(--hairline);
  padding:38px 34px 30px; text-align:center;
  animation:rise .5s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise{ from{ opacity:0; transform:translateY(18px) scale(.98);} to{ opacity:1; transform:none; } }
.auth-logo{ width:84px; height:84px; margin:0 auto 14px; filter:drop-shadow(0 6px 14px var(--celeste-30)); }
.auth-title{ font-size:25px; font-weight:800; letter-spacing:.3px; }
.auth-sub{ color:var(--ink-2); font-size:14px; margin-top:4px; margin-bottom:22px; }
.auth-tabs{ display:flex; background:var(--celeste-10); border-radius:var(--r-pill); padding:4px; margin-bottom:22px; }
.auth-tab{
  flex:1; padding:10px; border-radius:var(--r-pill); font-weight:600; font-size:14px;
  color:var(--ink-2); transition:all .2s ease;
}
.auth-tab.active{ background:var(--white); color:var(--ink); box-shadow:var(--shadow-sm); }
.auth-form{ text-align:left; }
.auth-divider{ display:flex; align-items:center; gap:12px; color:var(--ink-3); font-size:12.5px; margin:18px 0; }
.auth-divider::before, .auth-divider::after{ content:""; flex:1; height:1px; background:var(--hairline); }
.auth-error{
  background:rgba(11,11,12,.04); color:var(--ink); border:1px solid var(--hairline-2);
  border-radius:var(--r-sm); padding:11px 13px; font-size:13.5px; margin-bottom:14px; text-align:left;
}
.auth-foot{ font-size:13px; color:var(--ink-2); margin-top:14px; }

/* ===============================================================
   7. APP: BARRA SUPERIOR
   =============================================================== */
#app-view{ min-height:100vh; }

.topbar{
  position:fixed; top:0; left:0; right:0; height:var(--topbar-h);
  background:rgba(255,255,255,0.82); backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--hairline);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; z-index:40;
}
.topbar .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; letter-spacing:.2px; }
.topbar .brand img{ width:34px; height:34px; }
.topbar-actions{ display:flex; align-items:center; gap:10px; }
.avatar-btn{ width:40px; height:40px; border-radius:50%; overflow:hidden; border:2px solid var(--celeste); background:var(--celeste-10); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--celeste-press); transition:transform .15s ease; }
.avatar-btn:hover{ transform:scale(1.05); }
.avatar-btn img{ width:100%; height:100%; object-fit:cover; }

/* Menú desplegable del avatar */
.menu-pop{
  position:fixed; background:var(--white); border:1px solid var(--hairline);
  border-radius:var(--r-md); box-shadow:var(--shadow-lg); padding:8px; min-width:210px; z-index:45;
  animation:popIn .16s ease;
}
@keyframes popIn{ from{opacity:0; transform:translateY(-8px) scale(.97);} to{opacity:1; transform:none;} }
.menu-item{ display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:var(--r-sm); font-size:14.5px; font-weight:500; transition:background .15s ease; }
.menu-item:hover{ background:var(--celeste-10); }
.menu-item .ico{ width:20px; text-align:center; }
.menu-sep{ height:1px; background:var(--hairline); margin:6px 4px; }

/* ===============================================================
   8. APP: BARRA LATERAL (solo escritorio)
   =============================================================== */
.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w);
  background:var(--white); border-right:1px solid var(--hairline);
  display:flex; flex-direction:column; padding:22px 16px; z-index:41;
}
.sidebar .brand{ display:flex; align-items:center; gap:11px; padding:6px 8px 22px; font-weight:800; font-size:19px; }
.sidebar .brand img{ width:40px; height:40px; }
.nav-item{
  display:flex; align-items:center; gap:13px; padding:13px 14px; border-radius:var(--r-md);
  font-size:15.5px; font-weight:600; color:var(--ink-2);
  transition:background .18s ease, color .18s ease; margin-bottom:4px;
}
.nav-item .ico{ font-size:19px; width:24px; text-align:center; }
.nav-item:hover{ background:var(--celeste-10); color:var(--ink); }
.nav-item.active{ background:var(--celeste); color:#04303a; box-shadow:var(--shadow-sm); }
.nav-item.active .ico{ filter:drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
.sidebar-foot{ margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--hairline); }
.side-mini{ display:flex; align-items:center; gap:11px; }
.side-mini img{ width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid var(--celeste); }
.side-mini .nm{ font-weight:700; font-size:14px; }
.side-mini .em{ font-size:12px; color:var(--ink-2); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ===============================================================
   9. APP: CONTENIDO PRINCIPAL
   =============================================================== */
.main{ padding:calc(var(--topbar-h) + 22px) 22px 40px; max-width:1120px; margin:0 auto; }
.page-head{ margin-bottom:20px; }
.page-title{ font-size:26px; font-weight:800; letter-spacing:.2px; }
.page-sub{ color:var(--ink-2); font-size:14.5px; margin-top:3px; }

/* Filtro */
.filter-bar{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
.chip{
  padding:9px 17px; border-radius:var(--r-pill); font-size:14px; font-weight:600;
  background:var(--white); border:1.5px solid var(--hairline-2); color:var(--ink-2);
  transition:all .18s ease;
}
.chip:hover{ border-color:var(--celeste); color:var(--celeste-press); }
.chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* ===============================================================
   10. FEED / TARJETAS DE PUBLICACIÓN
   =============================================================== */
.feed-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(310px,1fr)); gap:20px; }

.post-card{
  background:var(--white); border:1px solid var(--hairline); border-radius:var(--r-lg);
  overflow:hidden; box-shadow:var(--shadow-sm); cursor:pointer;
  transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease;
  display:flex; flex-direction:column; animation:cardIn .45s ease both;
}
@keyframes cardIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
.post-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-lg); }
.post-cover{ width:100%; aspect-ratio:16/10; object-fit:contain; background:var(--celeste-10); }
.post-body{ padding:16px 17px 18px; display:flex; flex-direction:column; gap:9px; flex:1; }
.post-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.badge{ font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:var(--r-pill); text-transform:uppercase; letter-spacing:.5px; }
.badge-pagina{ background:var(--celeste-15); color:var(--celeste-press); }
.badge-local{ background:var(--ink); color:#fff; }
.post-title{ font-size:18px; font-weight:700; line-height:1.25; }
.post-desc{ font-size:14px; color:var(--ink-2); line-height:1.5; }
.post-desc .more{ color:var(--celeste-press); font-weight:600; }
.post-foot{ margin-top:auto; display:flex; align-items:center; gap:10px; padding-top:10px; border-top:1px solid var(--hairline); }
.post-author{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink-2); }
.post-author img{ width:26px; height:26px; border-radius:50%; object-fit:cover; border:1.5px solid var(--celeste); }
.post-time{ margin-left:auto; font-size:12px; color:var(--ink-3); }

/* Estado vacío */
.empty-state{ text-align:center; padding:70px 20px; color:var(--ink-2); }
.empty-state .em-ico{ font-size:54px; margin-bottom:14px; opacity:.85; }
.empty-state h3{ font-size:20px; font-weight:700; color:var(--ink); margin-bottom:6px; }
.empty-state p{ font-size:15px; margin-bottom:22px; }

/* Skeleton */
.skeleton{ background:linear-gradient(90deg, rgba(11,11,12,.045) 25%, var(--celeste-15) 37%, rgba(11,11,12,.045) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:var(--r-sm); }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:-100% 0;} }
.sk-card{ border:1px solid var(--hairline); border-radius:var(--r-lg); overflow:hidden; background:var(--white); }
.sk-cover{ width:100%; aspect-ratio:16/10; }
.sk-line{ height:13px; margin:14px 17px; }
.sk-line.s2{ width:60%; }

/* ===============================================================
   11. BOTTOM NAV (móvil / tablet)
   =============================================================== */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; height:var(--bottomnav-h);
  background:rgba(255,255,255,0.9); backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--hairline);
  display:flex; z-index:42; padding-bottom:env(safe-area-inset-bottom);
}
.bn-item{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:600; color:var(--ink-3); transition:color .15s ease; }
.bn-item .ico{ font-size:21px; }
.bn-item.active{ color:var(--celeste-press); }
.bn-item.active .ico{ transform:translateY(-1px); }

/* FAB crear (móvil) */
.fab{ position:fixed; right:18px; bottom:calc(var(--bottomnav-h) + 16px); width:58px; height:58px; border-radius:50%; background:var(--celeste); color:#04303a; font-size:28px; display:none; align-items:center; justify-content:center; box-shadow:var(--shadow-lg); z-index:43; }

/* ===============================================================
   12. MODALES
   =============================================================== */
.modal-back{
  position:fixed; inset:0; z-index:60; background:rgba(11,11,12,0.45);
  backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px;
  animation:fade .2s ease;
}
@keyframes fade{ from{opacity:0;} to{opacity:1;} }
.modal{
  width:100%; max-width:460px; background:var(--white); border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg); padding:26px 24px; animation:modalIn .26s cubic-bezier(.2,.8,.2,1);
  max-height:90vh; overflow:auto;
}
@keyframes modalIn{ from{opacity:0; transform:translateY(20px) scale(.96);} to{opacity:1; transform:none;} }
.modal h3{ font-size:21px; font-weight:800; margin-bottom:6px; }
.modal .m-sub{ color:var(--ink-2); font-size:14px; margin-bottom:20px; }

/* Selector de tipo (Página / Local) */
.type-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.type-card{ border:2px solid var(--hairline-2); border-radius:var(--r-lg); padding:22px 16px; text-align:center; transition:all .18s ease; cursor:pointer; }
.type-card:hover{ border-color:var(--celeste); background:var(--celeste-10); transform:translateY(-3px); }
.type-card .tc-ico{ font-size:34px; margin-bottom:8px; }
.type-card .tc-nm{ font-weight:700; font-size:16px; }

/* Subida de imágenes */
.dropzone{ border:2px dashed var(--celeste-30); border-radius:var(--r-md); padding:18px; text-align:center; color:var(--ink-2); cursor:pointer; transition:all .18s ease; background:var(--celeste-10); }
.dropzone:hover{ border-color:var(--celeste); background:var(--celeste-15); }
.dropzone .dz-ico{ font-size:30px; }
.thumbs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(82px,1fr)); gap:10px; margin-top:12px; }
.thumb{ position:relative; aspect-ratio:1; border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--hairline); background:var(--celeste-10); }
.thumb img{ width:100%; height:100%; object-fit:cover; }
.thumb .rm{ position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(11,11,12,.7); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; }
.thumb.cover::after{ content:"PORTADA"; position:absolute; bottom:0; left:0; right:0; background:var(--celeste); color:#04303a; font-size:9.5px; font-weight:800; text-align:center; padding:2px; letter-spacing:.5px; }

/* Barra de progreso */
.progress{ height:6px; background:var(--hairline); border-radius:999px; overflow:hidden; margin-top:8px; }
.progress > i{ display:block; height:100%; width:0; background:var(--celeste); transition:width .2s ease; }

/* ===============================================================
   13. VISTA DETALLE DE PUBLICACIÓN
   =============================================================== */
.detail-wrap{ max-width:840px; margin:0 auto; }
.detail-cover{ width:100%; max-height:440px; object-fit:contain; border-radius:var(--r-lg); box-shadow:var(--shadow-md); background:var(--celeste-10); }
.detail-title{ font-size:28px; font-weight:800; margin:18px 0 8px; line-height:1.2; }
.detail-meta{ display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.detail-desc{ font-size:16px; line-height:1.7; color:var(--ink); white-space:pre-wrap; margin-bottom:22px; }
.gallery{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-bottom:26px; }
.gallery img{ width:100%; aspect-ratio:1; object-fit:contain; background:var(--celeste-10); border-radius:var(--r-md); cursor:pointer; border:1px solid var(--hairline); transition:transform .18s ease; }
.gallery img:hover{ transform:scale(1.03); }
.detail-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; }

/* ===============================================================
   14. PERFIL
   =============================================================== */
.profile-head{ display:flex; align-items:center; gap:22px; background:var(--white); border:1px solid var(--hairline); border-radius:var(--r-xl); padding:26px; box-shadow:var(--shadow-sm); margin-bottom:26px; }
.profile-head img{ width:104px; height:104px; border-radius:50%; object-fit:cover; border:3px solid var(--celeste); box-shadow:var(--shadow-md); }
.profile-head .p-name{ font-size:24px; font-weight:800; }
.profile-head .p-bio{ color:var(--ink-2); font-size:14.5px; margin-top:4px; max-width:520px; }
.profile-stats{ display:flex; gap:26px; margin-top:10px; }
.profile-stats .st{ font-size:14px; color:var(--ink-2); }
.profile-stats .st b{ color:var(--ink); font-size:18px; display:block; }

/* ===============================================================
   15. TOASTS
   =============================================================== */
#toast-container{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:10px; width:max-content; max-width:92vw; }
.toast{ display:flex; align-items:center; gap:11px; background:var(--ink); color:#fff; padding:13px 18px; border-radius:var(--r-pill); box-shadow:var(--shadow-lg); font-size:14.5px; font-weight:500; animation:toastIn .3s cubic-bezier(.2,.8,.2,1); }
.toast.ok{ background:var(--celeste); color:#04303a; }
.toast.err{ background:#0b0b0c; }
.toast .ti{ font-size:17px; }
@keyframes toastIn{ from{opacity:0; transform:translateY(-16px) scale(.96);} to{opacity:1; transform:none;} }
.toast.out{ animation:toastOut .3s ease forwards; }
@keyframes toastOut{ to{opacity:0; transform:translateY(-12px);} }

/* ===============================================================
   16. LOADER GLOBAL
   =============================================================== */
#loader-overlay{ position:fixed; inset:0; z-index:90; background:rgba(255,255,255,0.7); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
#loader-overlay .spinner{ width:38px; height:38px; border-width:3.5px; }
#loader-overlay .ltxt{ color:var(--ink-2); font-size:14px; font-weight:500; }

/* ===============================================================
   17. LIGHTBOX
   =============================================================== */
#lightbox{ position:fixed; inset:0; z-index:95; background:rgba(11,11,12,0.9); display:flex; align-items:center; justify-content:center; padding:24px; animation:fade .2s ease; }
#lightbox img{ max-width:96vw; max-height:92vh; border-radius:var(--r-md); box-shadow:var(--shadow-lg); }
#lightbox .lb-close{ position:absolute; top:20px; right:24px; color:#fff; font-size:30px; }

/* ===============================================================
   18. RESPONSIVE
   =============================================================== */
/* Escritorio grande: sidebar + topbar */
@media (min-width:1024px){
  .sidebar{ display:flex; }
  .bottomnav{ display:none; }
  .fab{ display:none; }
  .main{ margin-left:var(--sidebar-w); padding-left:34px; padding-right:34px; }
  .topbar{ left:var(--sidebar-w); }
}
/* Tablet y móvil: topbar + bottom nav, sin sidebar */
@media (max-width:1023px){
  .sidebar{ display:none; }
  .bottomnav{ display:flex; }
  .fab{ display:flex; }
  .main{ padding-bottom:calc(var(--bottomnav-h) + 30px); }
  .topbar{ left:0; }
}
@media (max-width:520px){
  .main{ padding-left:14px; padding-right:14px; }
  .auth-card{ padding:30px 22px 24px; }
  .detail-title{ font-size:23px; }
  .profile-head{ flex-direction:column; text-align:center; }
  .profile-head .p-bio{ margin:0 auto; }
  .type-grid{ grid-template-columns:1fr; }
  .page-title{ font-size:22px; }
}
@media (min-width:521px) and (max-width:1023px){
  .feed-grid{ grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); }
}

/* ===============================================================
   19. AGENDAS / RESERVAS
   =============================================================== */
.ag-tabs{ display:flex; gap:4px; margin-bottom:18px; flex-wrap:wrap; border-bottom:1px solid var(--hairline); }
.ag-tab{ padding:12px 14px; font-weight:600; font-size:14.5px; color:var(--ink-2); border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .18s ease; }
.ag-tab:hover{ color:var(--ink); }
.ag-tab.active{ color:var(--celeste-press); border-bottom-color:var(--celeste); }

.ag-card{ background:var(--white); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow-sm); margin-bottom:18px; }
.ag-card h3{ font-size:18px; font-weight:800; margin-bottom:4px; }

.ag-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
.svc-card{ border:1px solid var(--hairline); border-radius:var(--r-md); padding:16px; display:flex; flex-direction:column; gap:8px; background:var(--white); transition:box-shadow .18s ease, transform .18s ease; }
.svc-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }
.svc-name{ font-weight:700; font-size:16px; line-height:1.25; }
.svc-meta{ font-size:13px; color:var(--ink-2); }
.svc-price{ font-weight:800; color:var(--celeste-press); font-size:18px; }
.svc-actions{ display:flex; gap:8px; margin-top:auto; flex-wrap:wrap; }
.tag{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:var(--r-pill); white-space:nowrap; }
.tag-on{ background:var(--celeste-15); color:var(--celeste-press); }
.tag-off{ background:rgba(11,11,12,.06); color:var(--ink-3); }

/* Calendario */
.cal{ border:1px solid var(--hairline); border-radius:var(--r-md); overflow:hidden; max-width:360px; }
.cal-head{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--hairline); font-weight:700; text-transform:capitalize; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); }
.cal-dow{ text-align:center; font-size:11px; font-weight:700; color:var(--ink-3); padding:8px 0; }
.cal-day{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; border-radius:var(--r-sm); margin:3px; transition:all .15s ease; }
.cal-day:hover:not(.disabled){ background:var(--celeste-10); color:var(--celeste-press); }
.cal-day.disabled{ color:var(--ink-3); opacity:.35; cursor:not-allowed; }
.cal-day.selected{ background:var(--celeste); color:#04303a; font-weight:700; }
.cal-day.today{ box-shadow:inset 0 0 0 2px var(--celeste-30); }

/* Slots de hora */
.slots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(82px,1fr)); gap:10px; margin-top:6px; }
.slot{ padding:11px 0; text-align:center; border:1.5px solid var(--hairline-2); border-radius:var(--r-sm); font-weight:600; font-size:14px; transition:all .15s ease; cursor:pointer; }
.slot:hover:not(.booked){ border-color:var(--celeste); background:var(--celeste-10); color:var(--celeste-press); }
.slot.selected{ background:var(--celeste); color:#04303a; border-color:var(--celeste); }
.slot.booked{ opacity:.4; cursor:not-allowed; text-decoration:line-through; }

/* Filas de reserva */
.bk-row{ display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--hairline); border-radius:var(--r-md); margin-bottom:10px; flex-wrap:wrap; }
.bk-row .bk-main{ flex:1; min-width:200px; }
.bk-code{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:800; letter-spacing:1px; color:var(--celeste-press); }
.bk-sub{ font-size:13px; color:var(--ink-2); }
.bk-status{ font-size:12px; font-weight:700; padding:4px 12px; border-radius:var(--r-pill); white-space:nowrap; }
.bk-pendiente{ background:rgba(11,11,12,.06); color:var(--ink-2); }
.bk-pagada{ background:var(--celeste-15); color:var(--celeste-press); }
.wa-btn{ background:#25D366; color:#fff; }
.wa-btn:hover{ background:#1ebe5b; }
.bk-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.code-box{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:24px; font-weight:800; letter-spacing:4px; color:var(--celeste-press); text-align:center; padding:14px; background:var(--celeste-10); border-radius:var(--r-md); margin:12px 0; }
</style>
</head>

// Toast: tipo 'ok' | 'err' | 'info'
function toast(message, type = "info", ms = 3200){
  const c = document.getElementById("toast-container");
  const t = document.createElement("div");
  t.className = "toast " + (type === "ok" ? "ok" : type === "err" ? "err" : "");
  const ic = type === "ok" ? "check" : type === "err" ? "warn" : "info";
  t.innerHTML = `<span class="ti" style="display:inline-flex;width:18px;height:18px;align-items:center;">${icon(ic)}</span><span>${esc(message)}</span>`;
  c.appendChild(t);
  setTimeout(() => {
    t.classList.add("out");
    setTimeout(() => t.remove(), 320);
  }, ms);
}

// Escapa HTML para inserción segura de texto del usuario
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Trunca texto y añade "… Ver más"
function summarize(text, max = 140){
  text = text || "";
  if(text.length <= max) return esc(text);
  return esc(text.slice(0, max).trim()) + ' <span class="more">… Ver más</span>';
}

// Tiempo relativo en español
function timeAgo(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now() - d.getTime())/1000);
  if(s < 60) return "ahora";
  if(s < 3600) return Math.floor(s/60) + " min";
  if(s < 86400) return Math.floor(s/3600) + " h";
  if(s < 2592000) return Math.floor(s/86400) + " d";
  return d.toLocaleDateString("es");
}

// Efecto ripple reutilizable en botones
function attachRipple(e){
  const btn = e.currentTarget;
  const r = btn.getBoundingClientRect();
  const size = Math.max(r.width, r.height);
  const dot = document.createElement("span");
  dot.className = "ripple-dot";
  dot.style.width = dot.style.height = size + "px";
  dot.style.left = (e.clientX - r.left - size/2) + "px";
  dot.style.top  = (e.clientY - r.top  - size/2) + "px";
  btn.appendChild(dot);
  setTimeout(() => dot.remove(), 600);
}
function bindRipple(root = document){
  root.querySelectorAll(".btn, .nav-item, .bn-item, .chip, .type-card").forEach(b => {
    if(b._rippled) return; b._rippled = true;
    b.addEventListener("click", attachRipple);
  });
}

// Modal genérico: openModal({title, sub, body, actions})
function openModal({ title = "", sub = "", body = "", actions = [] }){
  const root = document.getElementById("modal-root");
  const back = document.createElement("div");
  back.className = "modal-back";
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `
    ${title ? `<h3>${esc(title)}</h3>` : ""}
    ${sub ? `<div class="m-sub">${esc(sub)}</div>` : ""}
    <div class="m-body">${body}</div>
    <div class="m-actions flex gap-m" style="margin-top:22px; justify-content:flex-end;"></div>
  `;
  const actWrap = m.querySelector(".m-actions");
  actions.forEach(a => {
    const b = document.createElement("button");
    b.className = "btn " + (a.style || "btn-ghost");
    b.textContent = a.label;
    b.onclick = () => a.onClick && a.onClick(closeModal);
    actWrap.appendChild(b);
  });
  back.appendChild(m);
  root.appendChild(back);
  back.addEventListener("click", e => { if(e.target === back) closeModal(); });
  bindRipple(m);
  fillIcons(m);
  return { close: closeModal };
}
function closeModal(){
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
}

// Confirmación elegante -> Promise<boolean>
function confirmDialog(title, message, okLabel = "Confirmar"){
  return new Promise(resolve => {
    openModal({
      title, sub: message,
      actions: [
        { label: "Cancelar", style: "btn-ghost", onClick: (close) => { close(); resolve(false); } },
        { label: okLabel, style: "btn-dark", onClick: (close) => { close(); resolve(true); } }
      ]
    });
  });
}

function showAuthError(msg){ const e = document.getElementById("auth-error"); e.textContent = msg; e.classList.remove("hidden"); }

// Traduce errores comunes de Firebase a español
function translateAuthError(code){
  const map = {
    "auth/invalid-email":"El correo no es válido.",
    "auth/user-not-found":"No existe una cuenta con ese correo.",
    "auth/wrong-password":"Contraseña incorrecta.",
    "auth/email-already-in-use":"Ese correo ya está registrado.",
    "auth/weak-password":"La contraseña debe tener al menos 6 caracteres.",
    "auth/invalid-credential":"Credenciales inválidas.",
    "auth/popup-closed-by-user":"Ventana de Google cerrada.",
    "auth/network-request-failed":"Error de red. Revisa tu conexión."
  };
  return map[code] || "Ocurrió un error. Inténtalo de nuevo.";
}

// Login / Registro con correo y contraseña
document.getElementById("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAuthError();
  const email = document.getElementById("auth-email").value.trim();
  const pass  = document.getElementById("auth-pass").value;
  const name  = document.getElementById("auth-name").value.trim();
  const btn = document.getElementById("auth-submit");
  btn.disabled = true; showLoader(authMode === "login" ? "Iniciando sesión…" : "Creando cuenta…");

  try{
    if(authMode === "login"){
      await signInWithEmailAndPassword(auth, email, pass);
    } else {
      if(!name){ throw { code:"auth/missing-name" }; }
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      // Crear documento de usuario en Firestore
      await setDoc(doc(db, COL.users, cred.user.uid), {
        uid: cred.user.uid,
        name: name,
        email: email,
        photoURL: "",
        bio: "",
        createdAt: serverTimestamp()
      });
    }
    // onAuthStateChanged se encarga de mostrar la app
  }catch(err){
    showAuthError(translateAuthError(err.code));
  }finally{
    btn.disabled = false; hideLoader();
  }
});

// Login con Google
document.getElementById("auth-google").addEventListener("click", async () => {
  clearAuthError();
  showLoader("Conectando con Google…");
  try{
    const provider = new GoogleAuthProvider();
    const cred = await signInWithPopup(auth, provider);
    const u = cred.user;
    const ref = doc(db, COL.users, u.uid);
    const snap = await getDoc(ref);
    if(!snap.exists()){
      await setDoc(ref, {
        uid: u.uid, name: u.displayName || "Usuario",
        email: u.email || "", photoURL: u.photoURL || "", bio: "",
        createdAt: serverTimestamp()
      });
    }
  }catch(err){
    showAuthError(translateAuthError(err.code));
  }finally{ hideLoader(); }
});

// Cerrar sesión
async function logout(){
  const ok = await confirmDialog("Cerrar sesión", "¿Seguro que quieres salir de tu cuenta?");
  if(!ok) return;
  await signOut(auth); // onAuthStateChanged oculta la app
}

// Listener de estado de autenticación (mantiene la sesión iniciada)
onAuthStateChanged(auth, async (user) => {
  if(user){
    State.user = user;
    // Asegura documento de usuario (p.ej. login previo sin doc)
    let snap = await getDoc(doc(db, COL.users, user.uid));
    if(!snap.exists()){
      await setDoc(doc(db, COL.users, user.uid), {
        uid: user.uid, name: user.displayName || "Usuario",
        email: user.email || "", photoURL: user.photoURL || "", bio: "",
        createdAt: serverTimestamp()
      });
      snap = await getDoc(doc(db, COL.users, user.uid));
    }
    State.userData = snap.data();
    enterApp();
  }else{
    State.user = null; State.userData = null;
    exitApp();
  }
});

// Carga el feed con listener en tiempo real y filtro por tipo.
// Las publicaciones PRIVADAS solo son visibles para su autor:
//   - En "todos"/"pagina"/"local" se filtran en cliente (no aparecen a terceros).
//   - En "privadas" se muestran SOLO las del usuario actual.
function loadFeed(){
  if(State.feedUnsub) State.feedUnsub();

  const feedEl = document.getElementById("feed");
  feedEl.innerHTML = skeletonCards(6); // skeletons mientras carga

  // ESTRATEGIA DE FILTRO (sin índices compuestos en Firestore):
  // Firestore crea automáticamente índices de un solo campo, pero una consulta
  // con where() + orderBy() sobre campos distintos exige un índice compuesto
  // manual. Para evitar eso y mantener la app funcional sin configuración extra,
  // SIEMPRE consultamos ordenando solo por createdAt y filtramos en el cliente.
  // Esto escala bien para una v1 y no requiere crear índices en la consola.
  const q = query(collection(db, COL.posts), orderBy("createdAt", "desc"));

  State.feedUnsub = onSnapshot(q, (snap) => {
    let docs = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    // Filtro en cliente según la pestaña seleccionada
    const f = State.currentFilter || "todos";
    if(f === "pagina" || f === "local"){
      docs = docs.filter(d => d.data.type === f);
    } else if(f === "privadas"){
      // Solo las privadas del usuario actual
      docs = docs.filter(d => d.data.isPrivate && d.data.authorId === State.user.uid);
    } else {
      // "todos": oculta publicaciones privadas de OTROS usuarios
      docs = docs.filter(d => !d.data.isPrivate || d.data.authorId === State.user.uid);
    }
    if(docs.length === 0){
      feedEl.innerHTML = emptyState();
      const ec = document.getElementById("empty-create");
      if(ec) ec.onclick = () => navigate("crear");
      return;
    }
    feedEl.innerHTML = "";
    docs.forEach(d => feedEl.appendChild(postCard(d.id, d.data)));
    bindRipple(feedEl);
  }, (err) => {
    console.error(err);
    toast("Error al cargar el feed.", "err");
  });
}

function skeletonCards(n){
  let h = "";
  for(let i=0;i<n;i++){
    h += `<div class="sk-card"><div class="sk-cover skeleton"></div><div class="sk-line skeleton"></div><div class="sk-line skeleton s2"></div></div>`;
  }
  return h;
}

function emptyState(){

      <h3>No hay publicaciones todavía.</h3>
      <p>Sé el primero en crear una.</p>
      <button class="btn btn-primary btn-lg" id="empty-create">Crear publicación</button>
    </div>`;
  // tras insertar, enlazamos el botón:
}

// Tarjeta de publicación en el feed
function postCard(id, p){
  const card = document.createElement("div");
  card.className = "post-card";
  const typeLabel = p.type === "local" ? "Local" : "Página";
  const badgeCls = p.type === "local" ? "badge-local" : "badge-pagina";
  const privateBadge = p.isPrivate ? `<span class="badge" style="background:rgba(11,11,12,.08);color:var(--ink-2);">${icon("lock")} Privada</span>` : "";
  card.innerHTML = `
    <img class="post-cover" src="${esc(p.coverURL)}" alt="portada" loading="lazy" />
    <div class="post-body">
      <div class="post-top">
        <span class="badge ${badgeCls}">${typeLabel}</span>
        ${privateBadge}
      </div>
      <div class="post-title">${esc(p.title)}</div>
      <div class="post-desc">${summarize(p.description, 140)}</div>
      <div class="post-foot">
        <div class="post-author">
          <img src="${esc(p.authorPhoto || "")}" alt="" onerror="this.style.visibility='hidden'"/>
          <span>${esc(p.authorName || "Anónimo")}</span>
        </div>
        <span class="post-time">${timeAgo(p.createdAt)}</span>
      </div>
    </div>
  `;
  card.addEventListener("click", () => openPostDetail(id));
  // enlazar botón de estado vacío (si existe)
  setTimeout(() => { const b = document.getElementById("empty-create"); if(b) b.onclick = () => navigate("crear"); }, 0);
  return card;
}

// Comprime una imagen (File -> dataURL) usando canvas
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const r = Math.min(maxDim/width, maxDim/height);
          width = Math.round(width*r); height = Math.round(height*r);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

          ` : ""}

    document.getElementById("view-author").onclick = () => renderProfile(p.authorId);
    main.querySelectorAll(".gallery img").forEach(im => im.onclick = () => openLightbox(im.src));

    // Gestión: solo el autor
    const tp = document.getElementById("toggle-private");
    if(tp) tp.onclick = async () => {
      const ok = await confirmDialog("Cambiar visibilidad",
        p.isPrivate ? "¿Quieres hacer esta publicación pública para todos?" : "¿Quieres ocultar esta publicación solo para ti?",
        p.isPrivate ? "Hacer pública" : "Hacer privada");
      if(!ok) return;
      showLoader("Actualizando…");
      try{
        await updateDoc(doc(db, COL.posts, id), { isPrivate: !p.isPrivate });
        toast(p.isPrivate ? "Publicación hecha pública." : "Publicación hecha privada.", "ok");
        openPostDetail(id);
      }catch(err){ console.error(err); toast("No se pudo actualizar.", "err"); }
      finally{ hideLoader(); }
    };
    const dp = document.getElementById("delete-post");
    if(dp) dp.onclick = async () => {
      const ok = await confirmDialog("Eliminar publicación",
        "Esta acción no se puede deshacer. ¿Eliminar la publicación definitivamente?", "Eliminar");
      if(!ok) return;

        navigate("info");
      }catch(err){ console.error(err); toast("No se pudo eliminar.", "err"); }
      finally{ hideLoader(); }
    };
  }catch(err){
    console.error(err); toast("Error al abrir la publicación.", "err");
  }finally{ hideLoader(); }
}

const DOW = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let bk = null;                 // estado de la vista de reserva pública
let bookingsUnsubOwner = null; // listener de reservas del dueño

// --- Utilidades de agenda ---
function genCode(){
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sin caracteres ambiguos
  let s = "";
  for(let i=0;i<8;i++) s += c[Math.floor(Math.random()*c.length)];
  return s;
}
function waLink(phone, msg){
  const p = String(phone).replace(/\D/g, "");
  return "https://wa.me/" + p + "?text=" + encodeURIComponent(msg);
}
function formatPrice(p){
  const n = Number(p);
  if(isNaN(n) || n === 0) return "Gratis";
  return "$" + n.toLocaleString("es");
}
function dateKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function minToTime(m){
  const h = Math.floor(m/60), mm = m % 60;
  return String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
}
function timeToMin(t){
  const [h,m] = String(t).split(":").map(Number);
  return (h||0)*60 + (m||0);
}
function parseRanges(str){
  const out = [];
  (str||"").split(",").forEach(part => {
    const m = part.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if(m) out.push([ (+m[1])*60 + (+m[2]), (+m[3])*60 + (+m[4]) ]);
  });
  return out;
}
// Genera los horarios disponibles de un día según la config del dueño
function generateDaySlots(av, date){
  if(!av || !av.days || !av.days[date.getDay()]) return [];
  const ranges = parseRanges(av.slots || "");
  const gap = Math.max(5, parseInt(av.gap || "30", 10));
  const out = [];
  ranges.forEach(([s,e]) => { for(let t=s; t<e; t+=gap) out.push(minToTime(t)); });
  return out;
}

  const active = s.active !== false;
  return `<div class="svc-card" data-i="${i}">
    <div class="svc-name">${esc(s.name)}</div>
    ${s.description ? `<div class="svc-meta">${esc(s.description)}</div>` : ""}

    <div class="svc-price">${formatPrice(s.price)}</div>

      <button class="btn btn-ghost btn-sm" data-act="toggle">${active ? "Desactivar" : "Activar"}</button>
      <button class="btn btn-ghost btn-sm" data-act="del" style="color:#b00020;">Eliminar</button>
    </div>
  </div>`;

function bindServiceCards(body){
  body.querySelectorAll(".svc-card").forEach(card => {
    const i = +card.dataset.i;
    card.querySelector('[data-act="edit"]').onclick = () => openServiceModal(i);
    card.querySelector('[data-act="toggle"]').onclick = async () => {
      const snap = await getDoc(doc(db, COL.agenda, State.user.uid));
      const services = (snap.exists() ? snap.data().services : null) || [];
      if(services[i]){
        services[i] = { ...services[i], active: !(services[i].active !== false) };
        await setDoc(doc(db, COL.agenda, State.user.uid), { services }, { merge:true });
        renderAgendaTab("servicios");

function renderBookingsTab(body){
  body.innerHTML = `<div class="center" style="padding:30px;"><div class="spinner"></div></div>`;
  const q = query(collection(db, COL.bookings), orderBy("createdAt", "desc"));
  if(bookingsUnsubOwner) bookingsUnsubOwner();
  bookingsUnsubOwner = onSnapshot(q, (snap) => {
    const docs = snap.docs.map(d => ({ id:d.id, data:d.data() }))
                          .filter(d => d.data.ownerUid === State.user.uid);
    if(!docs.length){
      body.innerHTML = `<div class="empty-state" style="padding:50px 10px;"><div class="em-ico">${icon("list")}</div><h3>Sin reservas</h3><p>Cuando un cliente reserve, aparecerá aquí.</p></div>`;

    }
    body.innerHTML = docs.map(d => bookingRowHtml(d.id, d.data, true)).join("");
    fillIcons(body);
    bindBookingRows(body, true);
  }, err => { console.error(err); toast("Error al cargar reservas.","err"); });
}
function bookingRowHtml(id, b, isOwner){
  const status = b.status === "pagada"
    ? `<span class="bk-status bk-pagada">Pagada</span>`
    : `<span class="bk-status bk-pendiente">Pendiente</span>`;
  const wa = b.whatsapp
    ? `<a class="btn btn-sm wa-btn" href="${esc(waLink(b.whatsapp, "¡Hola! Hice una reserva, este es mi código: " + b.code))}" target="_blank" rel="noopener"><span class="ico" data-icon="whatsapp" style="width:16px;height:16px;margin-right:6px;"></span> WhatsApp</a>`
    : "";
  const actions = isOwner
    ? `<button class="btn btn-ghost btn-sm" data-act="toggle">${b.status==="pagada"?"Marcar pendiente":"Marcar pagada"}</button>
       <button class="btn btn-ghost btn-sm" data-act="del" style="color:#b00020;">Eliminar</button>`
    : `<button class="btn btn-ghost btn-sm" data-act="del" style="color:#b00020;">Cancelar reserva</button>`;
  return `<div class="bk-row" data-id="${id}">
    <div class="bk-main">
      <div><span class="bk-code">${esc(b.code)}</span> · ${esc(b.serviceName || "Servicio")}</div>
      <div class="bk-sub">${esc(b.customerName || "Cliente")} · ${esc(b.date)} ${esc(b.time)}</div>
      ${b.notes ? `<div class="bk-sub">${esc(b.notes)}</div>` : ""}
    </div>
    ${status}
    ${wa}
    <div class="bk-actions">${actions}</div>
  </div>`;
}
function bindBookingRows(body, isOwner){
  body.querySelectorAll(".bk-row").forEach(row => {
    const id = row.dataset.id;
    const toggle = row.querySelector('[data-act="toggle"]');
    if(toggle) toggle.onclick = async () => {
      const snap = await getDoc(doc(db, COL.bookings, id));
      if(!snap.exists()) return;
      const next = snap.data().status === "pagada" ? "pendiente" : "pagada";
      await updateDoc(doc(db, COL.bookings, id), { status: next });
      toast(next === "pagada" ? "Reserva marcada como pagada." : "Reserva marcada como pendiente.", "ok");
    };
    row.querySelector('[data-act="del"]').onclick = async () => {
      const ok = await confirmDialog("Eliminar reserva", "¿Eliminar esta reserva? Esta acción no se puede deshacer.", "Eliminar");
      if(!ok) return;
      await deleteDoc(doc(db, COL.bookings, id));
      toast("Reserva eliminada.","ok");
    };
  });
}

    </div>

      <div class="ag-card">
        <h3>Elige un servicio</h3>

            <div class="svc-card" data-si="${i}" style="${i===0?'border-color:var(--celeste);box-shadow:var(--shadow-md);':''}">

              ${s.description ? `<div class="svc-meta">${esc(s.description)}</div>` : ""}

        <h3>Elige fecha y hora</h3>
        <div id="bk-calendar"></div>
        <div id="bk-slots-wrap" style="margin-top:16px;"></div>
      </div>
      <div class="ag-card">
        <h3>Tus datos</h3>
        <form id="bk-form">
          <div class="field"><label>Nombre completo <span class="req">*</span></label><input class="input" id="bk-name" placeholder="Tu nombre" maxlength="60" required/></div>

          <div class="field"><label>Teléfono</label><input class="input" id="bk-phone" placeholder="Opcional" maxlength="20"/></div>
          <div class="field"><label>Notas (opcional)</label><textarea class="textarea" id="bk-notes" maxlength="300" placeholder="Algún detalle para el vendedor"></textarea></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="bk-submit" disabled>Confirmar reserva</button>
        </form>
      </div>
    </div>`;
  fillIcons(main);
  document.getElementById("bk-back").onclick = () => renderProfile(bk.ownerUid);
  main.querySelectorAll("#bk-services .svc-card").forEach(card => {
    card.onclick = () => {
      main.querySelectorAll("#bk-services .svc-card").forEach(c => { c.style.borderColor=""; c.style.boxShadow=""; });
      card.style.borderColor = "var(--celeste)"; card.style.boxShadow = "var(--shadow-md)";
      bk.selectedService = bk.services[+card.dataset.si];
      bk.selectedSlot = null;
      renderSlots();
    };
  });
  // fecha por defecto: primer día disponible (hoy mismo si aplica)
  for(let i=0;i<60;i++){
    const d = new Date(today); d.setDate(today.getDate()+i);
    if(bk.av.days && bk.av.days[d.getDay()]){ bk.year = d.getFullYear(); bk.month = d.getMonth(); bk.selectedDate = d; break; }
  }
  renderCalendar();
  loadBookedAndRenderSlots();
  document.getElementById("bk-form").addEventListener("submit", async (e) => { e.preventDefault(); await submitBooking(); });
}
function renderCalendar(){
  const wrap = document.getElementById("bk-calendar"); if(!wrap) return;
  const y = bk.year, m = bk.month;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const date = new Date(y, m, d); date.setHours(0,0,0,0);
    const disabled = date < today || !(bk.av.days && bk.av.days[date.getDay()]);
    const isToday = date.getTime() === today.getTime();
    const selected = bk.selectedDate && bk.selectedDate.getTime() === date.getTime();
    cells += `<div class="cal-day ${disabled?"disabled":""} ${isToday?"today":""} ${selected?"selected":""}" data-d="${d}">${d}</div>`;
  }
  wrap.innerHTML = `
    <div class="cal">
      <div class="cal-head">
        <button class="btn btn-ghost btn-sm" id="cal-prev">‹</button>
        <span>${MONTHS[m]} ${y}</span>
        <button class="btn btn-ghost btn-sm" id="cal-next">›</button>
      </div>
      <div class="cal-grid">${DOW.map(n => `<div class="cal-dow">${n[0]}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
    </div>`;
  const prev = document.getElementById("cal-prev"), next = document.getElementById("cal-next");
  if(prev) prev.onclick = () => { bk.month--; if(bk.month < 0){ bk.month = 11; bk.year--; } renderCalendar(); };
  if(next) next.onclick = () => { bk.month++; if(bk.month > 11){ bk.month = 0; bk.year++; } renderCalendar(); };
  wrap.querySelectorAll(".cal-day:not(.disabled)").forEach(cell => {
    cell.onclick = () => {
      const d = +cell.dataset.d;
      bk.selectedDate = new Date(bk.year, bk.month, d); bk.selectedDate.setHours(0,0,0,0);
      bk.selectedSlot = null;
      renderCalendar(); loadBookedAndRenderSlots();
    };
  });
}
async function loadBookedAndRenderSlots(){
  if(!bk.selectedDate){ renderSlots(); return; }
  const key = dateKey(bk.selectedDate);
  try{
    const snap = await getDocs(query(collection(db, COL.bookings), orderBy("createdAt", "desc")));
    const set = new Set();
    snap.forEach(d => {
      const b = d.data();
      if(b.ownerUid === bk.ownerUid && b.date === key && b.status !== "cancelado") set.add(b.time);
    });
    bk.booked = set;
  }catch(e){ console.error(e); }
  renderSlots();
}
function renderSlots(){
  const wrap = document.getElementById("bk-slots-wrap"); if(!wrap) return;
  if(!bk.selectedDate){ wrap.innerHTML = `<div class="muted tiny">Selecciona una fecha para ver los horarios.</div>`; updateSubmitBtn(); return; }
  const slots = generateDaySlots(bk.av, bk.selectedDate);
  if(!slots.length){ wrap.innerHTML = `<div class="muted tiny">No hay horarios disponibles este día.</div>`; bk.selectedSlot = null; updateSubmitBtn(); return; }
  wrap.innerHTML = `<div class="slots">` + slots.map(t => {
    const booked = bk.booked.has(t);
    const sel = bk.selectedSlot === t;
    return `<div class="slot ${booked?"booked":""} ${sel?"selected":""}" data-t="${t}">${t}</div>`;
  }).join("") + `</div>`;
  wrap.querySelectorAll(".slot:not(.booked)").forEach(s => {
    s.onclick = () => {
      bk.selectedSlot = s.dataset.t;
      wrap.querySelectorAll(".slot").forEach(x => x.classList.remove("selected"));
      s.classList.add("selected");
      updateSubmitBtn();
    };
  });
  updateSubmitBtn();
}
function updateSubmitBtn(){
  const btn = document.getElementById("bk-submit"); if(!btn) return;
  btn.disabled = !(bk.selectedService && bk.selectedDate && bk.selectedSlot);
}
async function submitBooking(){
  const name = document.getElementById("bk-name").value.trim();
  const email = document.getElementById("bk-email").value.trim();
  if(!name || !email){ toast("Completa nombre y correo.","err"); return; }
  if(!bk.selectedService || !bk.selectedDate || !bk.selectedSlot){ toast("Elige servicio, fecha y hora.","err"); return; }
  const btn = document.getElementById("bk-submit"); btn.disabled = true; showLoader("Reservando…");
  const code = genCode();
  try{
    await addDoc(collection(db, COL.bookings), {
      code,
      ownerUid: bk.ownerUid,
      ownerName: bk.ownerName,
      whatsapp: bk.av.whatsapp,
      serviceId: bk.selectedService.id != null ? String(bk.selectedService.id) : "",
      serviceName: bk.selectedService.name,
      duration: bk.selectedService.duration || 30,
      price: bk.selectedService.price,
      customerUid: State.user ? State.user.uid : "",
      customerName: name,
      customerEmail: email,
      customerPhone: document.getElementById("bk-phone").value.trim(),
      notes: document.getElementById("bk-notes").value.trim(),
      date: dateKey(bk.selectedDate),
      time: bk.selectedSlot,
      status: "pendiente",
      createdAt: serverTimestamp()
    });
    hideLoader();
    openBookingConfirm(code, name);
  }catch(err){ console.error(err); toast("No se pudo reservar. Revisa tu conexión.","err"); }
  finally{ hideLoader(); btn.disabled = false; }
}
function openBookingConfirm(code, name){
  const link = waLink(bk.av.whatsapp, "¡Hola! Hice una reserva, este es mi código: " + code);
  openModal({
    title: "¡Reserva confirmada!",
    sub: `Gracias ${esc(name)}. Tu código es:`,
    body: `
      <div class="code-box">${esc(code)}</div>
      <div class="muted" style="text-align:center;font-size:14px;margin-bottom:14px;">Contácta al vendedor por WhatsApp para acordar el pago y confirmar tu cita.</div>
      <a class="btn wa-btn btn-block btn-lg" href="${esc(link)}" target="_blank" rel="noopener"><span class="ico" data-icon="whatsapp" style="width:18px;height:18px;margin-right:7px;"></span> Contactar por WhatsApp</a>`,
    actions: [
      { label:"Cerrar", style:"btn-ghost", onClick: c => { c(); renderBookingView({ ownerUid:bk.ownerUid, ownerName:bk.ownerName, services:bk.services, av:bk.av }); } }
    ]
  });
  fillIcons(document.getElementById("modal-root"));
}

function renderProfile(uid){
  setActiveNav(uid === State.user.uid ? "perfil" : null);
  const isSelf = uid === State.user.uid;
  main.innerHTML = `
    <div id="profile-content">
      <div class="profile-head">
        <img id="pf-avatar" alt="avatar" style="display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--celeste-press);" />
        <div>
          <div class="p-name" id="pf-name">—</div>
          <div class="p-bio" id="pf-bio"></div>
          <div class="profile-stats">
            <div class="st"><b id="pf-count">0</b> publicaciones</div>
          </div>
          ${isSelf ? "" : `<div style="margin-top:14px;"><button class="btn btn-primary" id="pf-book"><span class="ico" data-icon="calendar" style="width:16px;height:16px;margin-right:6px;"></span> Reservar / Agendar</button></div>`}
        </div>
      </div>
      <div id="pf-posts" class="feed-grid"></div>
      ${isSelf ? `
        <div class="ag-card" style="margin-top:24px;">
          <h3 style="margin-bottom:14px;">Mis reservas</h3>
          <div id="pf-bookings"></div>
        </div>` : ""}
    </div>
  `;
  fillIcons(main);
  document.getElementById("pf-posts").innerHTML = skeletonCards(4);
  if(!isSelf){
    document.getElementById("pf-book").onclick = () => openBookingPage(uid);
  }
  if(isSelf){
    const pb = document.getElementById("pf-bookings");
    pb.innerHTML = `<div class="center" style="padding:20px;"><div class="spinner"></div></div>`;
    getDocs(query(collection(db, COL.bookings), orderBy("createdAt", "desc"))).then(snap => {
      const mine = snap.docs.map(d => ({ id:d.id, data:d.data() }))
                             .filter(d => d.data.customerUid === State.user.uid && d.data.status !== "cancelado");
      if(!mine.length){ pb.innerHTML = `<div class="muted tiny" style="padding:6px 0;">Aún no tienes reservas. Agenda desde el perfil de un negocio.</div>`; return; }
      pb.innerHTML = mine.map(d => bookingRowHtml(d.id, d.data, false)).join("");
      fillIcons(pb); bindBookingRows(pb, false);
    }).catch(err => { console.error(err); pb.innerHTML = `<div class="muted tiny">No se pudieron cargar tus reservas.</div>`; });
  }

  // Datos del usuario
  getDoc(doc(db, COL.users, uid)).then(snap => {
    if(snap.exists()){
      const u = snap.data();
      setAvatar(document.getElementById("pf-avatar"), u.photoURL, u.name);
      document.getElementById("pf-name").textContent = u.name || "Usuario";
      document.getElementById("pf-bio").textContent = u.bio || "Sin descripción.";
    }
  });

  // Publicaciones del usuario: consultamos solo por createdAt y filtramos
  // por autor en cliente, para NO requerir índices compuestos en Firestore.
  if(State.profileUnsub) State.profileUnsub();
  const q = query(collection(db, COL.posts), orderBy("createdAt", "desc"));
  State.profileUnsub = onSnapshot(q, (snap) => {
    const docs = snap.docs.filter(d => d.data().authorId === uid);
    document.getElementById("pf-count").textContent = docs.length;
    const wrap = document.getElementById("pf-posts");
    if(docs.length === 0){ wrap.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="em-ico">${icon("doc")}</div><h3>Sin publicaciones</h3><p>Este usuario aún no ha creado ninguna.</p></div>`; return; }
    wrap.innerHTML = "";
    docs.forEach(d => wrap.appendChild(postCard(d.id, d.data())));
    bindRipple(wrap);
  });
}

/* ---------------------------------------------------------------
   K. CONFIGURACIÓN
   --------------------------------------------------------------- */
function renderSettings(){
  setActiveNav("config");
  const u = State.userData || {};
  main.innerHTML = `
    <div class="page-head">
      <div class="page-title">Configuración</div>
      <div class="page-sub">Edita tu información de perfil.</div>
    </div>
    <div style="max-width:600px; margin:0 auto;">
      <form id="settings-form">
        <div class="field">
          <label>Foto de perfil</label>
          <div style="display:flex; align-items:center; gap:16px;">
            <div id="st-avatar" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--celeste); display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--celeste-press);"></div>
            <button type="button" class="btn btn-ghost" id="st-change">Cambiar foto</button>
            <input type="file" id="st-file" accept="image/*" hidden />
          </div>
        </div>
        <div class="field">
          <label>Nombre <span class="req">*</span></label>
          <input class="input" type="text" id="st-name" value="${esc(u.name || "")}" maxlength="60" required />
        </div>
        <div class="field">
          <label>Descripción del perfil</label>
          <textarea class="textarea" id="st-bio" maxlength="300" placeholder="Cuéntale a la comunidad sobre ti…">${esc(u.bio || "")}</textarea>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Guardar cambios</button>
      </form>
    </div>
  `;
  const av = document.getElementById("st-avatar");
  setAvatar(av, u.photoURL, u.name);

  let newPhotoData = null;
  document.getElementById("st-change").onclick = () => document.getElementById("st-file").click();
  document.getElementById("st-file").onchange = async () => {
    if(!document.getElementById("st-file").files[0]) return;
    newPhotoData = await compressImage(document.getElementById("st-file").files[0], 512, 0.85);
    setAvatar(av, newPhotoData, name);
  };

  document.getElementById("settings-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("st-name").value.trim();
    const bio  = document.getElementById("st-bio").value.trim();
    if(!name){ toast("El nombre es obligatorio.", "err"); return; }
    showLoader("Guardando…");
    try{
      const updates = { name, bio };
      if(newPhotoData){
        // Foto de perfil guardada como dataURL en Firestore (sin Storage)
        updates.photoURL = newPhotoData;
        await updateProfile(State.user, { displayName: name }).catch(()=>{});
      } else {
        await updateProfile(State.user, { displayName: name }).catch(()=>{});
      }
      await updateDoc(doc(db, COL.users, State.user.uid), updates);
      State.userData = { ...State.userData, ...updates };
      refreshChrome();
      toast("Perfil actualizado.", "ok");
    }catch(err){
      console.error(err); toast("No se pudo guardar.", "err");
    }finally{ hideLoader(); }
  });
}

/* ---------------------------------------------------------------
   HELPERS DE UI: refrescar avatar/nombre en barra y sidebar
   --------------------------------------------------------------- */
function refreshChrome(){
  const u = State.userData || {};
  setAvatar(document.getElementById("avatar-btn"), u.photoURL, u.name);
  setAvatar(document.getElementById("side-avatar"), u.photoURL, u.name);
  document.getElementById("side-name").textContent = u.name || "Usuario";
  document.getElementById("side-email").textContent = u.email || "";
}

/* ---------------------------------------------------------------
   L. ARRANQUE / TRANSICIONES DE SESIÓN
   --------------------------------------------------------------- */
function enterApp(){
  document.getElementById("login-view").classList.add("hidden");
  document.getElementById("app-view").classList.remove("hidden");
  refreshChrome();
  navigate("info");
  hideLoader();
}
function exitApp(){
  if(State.feedUnsub) State.feedUnsub();
  if(State.profileUnsub) State.profileUnsub();
  document.getElementById("app-view").classList.add("hidden");
  document.getElementById("login-view").classList.remove("hidden");
}

// Init: aplica logo, enlaza ripple global y arranca
applyLogo();
bindRipple(document);
document.getElementById("auth-submit").disabled = false;
</script>
